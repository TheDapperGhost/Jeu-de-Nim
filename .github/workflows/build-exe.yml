name: Build EXE

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build EXE with PyInstaller
      run: |
        pyinstaller --onefile --windowed --name "Jeu de Nim" --icon=allumette.ico main.py
      continue-on-error: true

    - name: Build EXE (fallback without icon)
      if: failure()
      run: |
        pyinstaller --onefile --windowed --name "Jeu de Nim" main.py

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Jeu-de-Nim-exe-${{ github.run_number }}
        path: dist/Jeu de Nim.exe
        retention-days: 30

    - name: Create/Update Release
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "dist/*.exe"
        tag: latest
        name: Latest Build
        body: "Dernière version compilée de Jeu de Nim - Build ${{ github.run_number }}"
        makeLatest: true
        allowUpdates: true
        removeArtifacts: true
        replacesArtifacts: true
        token: ${{ secrets.GITHUB_TOKEN }}
